<text x="345.0" y="774.0" font-size="12" fill="#0b2a4a" font-weight="normal" text-anchor="middle">各行の理由を</text>
<text x="345.0" y="791.0" font-size="12" fill="#0b2a4a" font-weight="normal" text-anchor="middle">事実から組み立てる(F6)</text>
<rect x="460" y="690" width="190" height="120" rx="6" fill="#85BBF0" stroke="#2b6cb0" stroke-opacity=".5"/>
<text x="555.0" y="730.0" font-size="17" fill="#0b2a4a" font-weight="bold" text-anchor="middle">連絡文作成</text>
