<text x="555.0" y="774.0" font-size="12" fill="#0b2a4a" font-weight="normal" text-anchor="middle">下書きを作る(F8)</text>
<text x="555.0" y="791.0" font-size="12" fill="#0b2a4a" font-weight="normal" text-anchor="middle">割り当てとの照合</text>
<rect x="780" y="690" width="220" height="120" rx="6" fill="#85BBF0" stroke="#2b6cb0" stroke-opacity=".5" stroke-dasharray="6 4"/>
<text x="890.0" y="730.0" font-size="17" fill="#0b2a4a" font-weight="bold" text-anchor="middle">デモデータ</text>
<text x="890.0" y="747.0" font-size="11" fill="#0b2a4a" font-weight="normal" text-anchor="middle">[Component: sample_data.py]</text>
<text x="890.0" y="774.0" font-size="12" fill="#0b2a4a" font-weight="normal" text-anchor="middle">架空のマスターと</text>
<text x="890.0" y="791.0" font-size="12" fill="#0b2a4a" font-weight="normal" text-anchor="middle">月次データを入れる</text>
<rect x="40" y="900" width="330" height="120" rx="6" fill="#85BBF0" stroke="#2b6cb0" stroke-opacity=".5"/>
<text x="205.0" y="940.0" font-size="17" fill="#0b2a4a" font-weight="bold" text-anchor="middle">ルール判定</text>
<text x="205.0" y="957.0" font-size="11" fill="#0b2a4a" font-weight="normal" text-anchor="middle">[Component: Python — scheduler/rules.py]</text>
<text x="205.0" y="984.0" font-size="12" fill="#0b2a4a" font-weight="normal" text-anchor="middle">R1〜R10 を判定する(Must / Should / 警告)</text>
<text x="205.0" y="1001.0" font-size="12" fill="#0b2a4a" font-weight="normal" text-anchor="middle">DB にも画面にも触らない</text>
