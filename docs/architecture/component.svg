<text x="135.0" y="765.5" font-size="12" fill="#0b2a4a" font-weight="normal" text-anchor="middle">案を作る(F4)</text>
<text x="135.0" y="782.5" font-size="12" fill="#0b2a4a" font-weight="normal" text-anchor="middle">代わりの系統(F9)</text>
<text x="135.0" y="799.5" font-size="12" fill="#0b2a4a" font-weight="normal" text-anchor="middle">組めない理由(F5)</text>
