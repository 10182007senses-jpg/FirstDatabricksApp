<rect x="40" y="270" width="440" height="120" rx="6" fill="#85BBF0" stroke="#2b6cb0" stroke-opacity=".5"/>
<text x="260.0" y="310.0" font-size="17" fill="#0b2a4a" font-weight="bold" text-anchor="middle">月次調整の画面</text>
<text x="260.0" y="327.0" font-size="11" fill="#0b2a4a" font-weight="normal" text-anchor="middle">[Component: Dash — app.py]</text>
<text x="260.0" y="354.0" font-size="12" fill="#0b2a4a" font-weight="normal" text-anchor="middle">① 準備・② 割り当て案・③ 連絡文</text>
<text x="260.0" y="371.0" font-size="12" fill="#0b2a4a" font-weight="normal" text-anchor="middle">表示と操作だけ(計算はしない)</text>
<rect x="640" y="270" width="380" height="120" rx="6" fill="#85BBF0" stroke="#2b6cb0" stroke-opacity=".5"/>
<text x="830.0" y="318.5" font-size="17" fill="#0b2a4a" font-weight="bold" text-anchor="middle">登録の画面</text>
<text x="830.0" y="335.5" font-size="11" fill="#0b2a4a" font-weight="normal" text-anchor="middle">[Component: Dash — app.py]</text>
<text x="830.0" y="362.5" font-size="12" fill="#0b2a4a" font-weight="normal" text-anchor="middle">マスター登録(F2)・設定(Should の重み)</text>
<rect x="40" y="470" width="440" height="120" rx="6" fill="#85BBF0" stroke="#2b6cb0" stroke-opacity=".5"/>
<text x="260.0" y="510.0" font-size="17" fill="#0b2a4a" font-weight="bold" text-anchor="middle">割り当て管理</text>
<text x="260.0" y="527.0" font-size="11" fill="#0b2a4a" font-weight="normal" text-anchor="middle">[Component: Python — scheduler/manager.py]</text>
<text x="260.0" y="554.0" font-size="12" fill="#0b2a4a" font-weight="normal" text-anchor="middle">手順をまとめる:取り込む・案を作る・修正する・</text>
<text x="260.0" y="571.0" font-size="12" fill="#0b2a4a" font-weight="normal" text-anchor="middle">確定する・連絡文を作る(F1/F4/F7/F8/F14)</text>
<rect x="640" y="470" width="260" height="120" rx="6" fill="#85BBF0" stroke="#2b6cb0" stroke-opacity=".5"/>
<text x="770.0" y="510.0" font-size="17" fill="#0b2a4a" font-weight="bold" text-anchor="middle">データアクセス</text>
<text x="770.0" y="527.0" font-size="11" fill="#0b2a4a" font-weight="normal" text-anchor="middle">[Component: data_access.py + schema.py]</text>
<text x="770.0" y="554.0" font-size="12" fill="#0b2a4a" font-weight="normal" text-anchor="middle">テーブルの読み書きを一か所に集める</text>
